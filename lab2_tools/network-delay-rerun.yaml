# Lab 2 network-delay RE-RUN (31 Oct 2026): 100 ms delay on all reviews pods for 2 minutes.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: bookinfo-network-delay-rerun
  namespace: bookinfo
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - bookinfo
    labelSelectors:
      app: reviews
  delay:
    latency: "100ms"
    jitter: "0ms"
    correlation: "0"
  duration: "2m"